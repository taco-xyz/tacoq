name: Test - Relay

on:
  pull_request:
    branches:
      - main
    paths:
      - 'relay/**'
      - '.github/**'

permissions:
  contents: read
  actions: read # Needed for artifact upload/download

jobs:
  # =================================================
  # Build & Image Upload
  # =================================================

  relay-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: relay/Dockerfile
          target: builder
          outputs: type=docker,dest=/tmp/app-image.tar
          tags: tacoq-relay:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/app-image.tar

  # =================================================
  # Relay Tests
  # These only depend on the database, so we run the
  # postgres service in the same container.
  # =================================================

  relay-tests:
    name: Run relay tests
    needs: [relay-build]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/app-image.tar

      - name: Run tests in container
        run: |
          docker run --network host \
            -e DATABASE_URL=${DATABASE_URL} \
            tacoq-relay cargo test --release --all-features