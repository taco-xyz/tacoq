name: Publish

on:
  push:
    tags:
      - 'general@*' # General Lockstep Release. Releases a new version of everything.
      - 'relay@*' # Relay Release. Only releases a new version of the Relay.
      - 'python@*' # Python Release. Only releases a new version of the Python SDK.

jobs:
  # =================================================
  # Publish Manager
  # =================================================

  publish_manager:
    name: Publish Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/general@') || startsWith(github.ref, 'refs/tags/relay@')
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/tacoq-relay

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # We must parse the tag version to assign to the Docker image.
      - name: Extract version from Git tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"  # e.g. tacoq@0.4.0 or relay@0.4.0
          VERSION="${TAG#*@}"       # strips everything before the @
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: relay/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # =================================================
  # Publish Python SDK
  # =================================================

  publish_python_sdk:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'general@') || startsWith(github.ref_name, 'python@')
    permissions:
      id-token: write # Required for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build package
        run: |
          cd client_sdks/python
          uv build

      - name: Publish package to PyPI
        run: |
          cd client_sdks/python
          uv publish
