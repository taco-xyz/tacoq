name: Publish

on:
  push:
    tags:
      - 'general@*' # General Lockstep Release. Releases a new version of everything.
      - 'relay@*' # Relay Release. Only releases a new version of the Relay.
      - 'python@*' # Python Release. Only releases a new version of the Python SDK.
jobs:

  extract_version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from Git tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#*@}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

  # =================================================
  # Publish Manager
  # =================================================

  build:
    name: Build Docker image
    needs: extract_version
    env:
      REGISTRY: ghcr.io
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/tacoq-relay
    permissions:
      contents: read
      packages: write

    # Run on both AMD64 and ARM64
    strategy:
      matrix:
        config:
          - {arch: 'arm64', platform: 'linux/arm64'}
          - {arch: 'amd64', platform: 'linux/amd64'}
    runs-on: ${{ matrix.config.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
          
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          file: relay/Dockerfile          
          context: .
          platforms: ${{ matrix.config.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

          tags: ${{ env.REGISTRY_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.config.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          
  merge:
    name: Merge Docker manifest and publish
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/tacoq-relay
    needs:
      - build
      - extract_version
    permissions:
        contents: read
        packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *) --tag ${{ env.REGISTRY_IMAGE }}:${{ needs.extract_version.outputs.version }}          

  # =================================================
  # Publish Python SDK
  # =================================================

  publish_python_sdk:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: extract_version
    if: startsWith(github.ref_name, 'general@') || startsWith(github.ref_name, 'python@')
    permissions:
      id-token: write # Required for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build package
        run: |
          cd client_sdks/python
          uv build

      - name: Publish package to PyPI
        run: |
          cd client_sdks/python
          uv publish
